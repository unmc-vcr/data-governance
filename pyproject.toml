[project]
name = "unmc-glossary-site"
version = "0.2.0"
description = "Static site generator for the UNMC research data governance glossary"
requires-python = ">=3.10"
dependencies = [
    "linkml==1.11.1",
    "linkml-runtime>=1.8",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
build-glossary-site = "glossary_site.build:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/glossary_site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
