# Who governs: the governance process, the council, and the people and
# organizations who sit on it or hold roles for terms.
#
# Organizations are offices, not people. An office IRI survives staff turnover;
# a person's name does not. Responsibility for a term lands on an office or the
# council, never on a person.
#
# `type` values are DGO class IRIs. Keep the readable name in a comment.

