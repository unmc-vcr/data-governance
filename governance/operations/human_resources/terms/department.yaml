glossary_terms:
  - id: term:department
    label: Department
    alt_labels:
      - Academic Department
    definition: >-
      The second level of UNMC's organizational hierarchy: an academic or administrative
      organizational unit within a vice chancellor or vice president unit. A department may
      be divided into divisions.
