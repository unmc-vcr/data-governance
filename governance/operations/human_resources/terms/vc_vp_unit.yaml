glossary_terms:
  - id: term:vc-vp-unit
    label: Unit
    alt_labels:
      - VC/VP Unit
      - Vice Chancellor Unit
      - College
    definition: >-
      The top level of the campus organizational hierarchy. The organizational unit led by a
      vice chancellor or dean, such as a college or an administrative area. A
      unit is made up of departments.
