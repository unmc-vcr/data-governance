glossary_terms:
  - id: term:clinical-research
    label: Clinical research
    definition: >-
      A study involving interactions with patients, diagnostic clinical materials or data, 
      or populations, intended to produce knowledge valuable for understanding human disease, 
      preventing and treating illness, and/or promoting health.
    part_of: area:unmc-glossary
    in_subject_area: area:clinical-research
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:ra-governance-council
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:clinical-research-office

term_creations:
