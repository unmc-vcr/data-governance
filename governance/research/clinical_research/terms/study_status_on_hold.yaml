glossary_terms:
  - id: term:study-status-on-hold
    label: On Hold
    alt_labels:
      - Enrollment suspended
      - Temporarily closed to accrual
    definition: >-
      An study status in which enrollment of new subjects is temporarily suspended while the
      study remains active, with the expectation of reopening.
    part_of: area:unmc-glossary
    in_subject_area: area:clinical-research
    semantic_type: bfo:0000019   # quality (state)
    value_of: term:study-status
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

term_creations:
  - id: term:study-status-on-hold-creation
    label: Creation of "On Hold"
    has_output: term:study-status-on-hold
    part_of: gov:research-data-governance

term_status_boundaries:   # quote every date
