glossary_terms:
  - id: term:study-status-closed-to-accrual
    label: Closed to Accrual
    alt_labels:
      - Closed
      - Enrollment closed
    definition: >-
      An accrual status in which a study is no longer permitted to enroll new subjects,
      whether because target accrual was reached or because the study was terminated.
    part_of: area:unmc-glossary
    in_subject_area: area:clinical-research
    semantic_type: bfo:0000019   # quality (state)
    value_of: term:study-status
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

term_creations:
  - id: term:study-status-closed-to-accrual-creation
    label: Creation of "Closed to Accrual"
    has_output: term:study-status-closed-to-accrual
    part_of: gov:research-data-governance

