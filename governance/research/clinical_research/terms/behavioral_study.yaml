glossary_terms:
  - id: term:behavioral-study
    label: Behavioral and social sciences research
    definition: >-
      Research involving the systematic study of behavioral phenomena—the observable actions
      of individuals or groups and to mental phenomena such as knowledge, attitudes,
      beliefs, motivations, perceptions, cognitions, and emotions— and social
      phenomena—those interactions between and among individuals, and to the
      characteristics, structures, and functions of social groups and institutions—relevant
      to a person's complete physical, mental, and social well-being.
    definition_source: https://obssr.od.nih.gov/about/bssr-definition
    part_of: area:unmc-glossary
    in_subject_area: area:clinical-research
    broader:
      - term:clinical-research
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

