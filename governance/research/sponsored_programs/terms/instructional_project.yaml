glossary_terms:
  - id: term:instructional-project
    label: Instructional Project
    alt_labels:
      - Instruction
      - Training Project
    definition: >-
      An activity specifically organized and separately budgeted to produce teaching,
      training, or other instructional outcomes, whether commissioned by an agency external
      to the institution or separately by an organizational unit within the institution.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000015   # process (process)
    broader:
      - term:sponsored-project
    responsibilities:
