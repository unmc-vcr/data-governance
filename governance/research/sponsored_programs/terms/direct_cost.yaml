glossary_terms:
  - id: term:direct-cost
    label: Direct Cost
    definition: >-
      A cost that can be identified specifically with a particular sponsored project, an
      instructional activity, or any other institutional activity, or that can be directly
      assigned to such activities relatively easily with a high degree of accuracy.
    definition_source: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_7/7.3_direct_costs_and_indirect_costs.htm
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000027   # data item (measure)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

