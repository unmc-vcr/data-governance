glossary_terms:
  - id: term:assistance-listing-number
    label: Assistance Listing Number
    alt_labels:
      - CFDA Number
      - CFDA
      - Assistance Listing
    definition: >-
      The number identifying a federal assistance program, formerly the Catalog of Federal
      Domestic Assistance (CFDA) number. It ties an award to the specific federal program
      that funds it.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000030   # information content entity (information_artifact)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

