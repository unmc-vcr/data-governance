glossary_terms:
  - id: term:federal-pass-through
    label: Federal Pass-Through Funding
    alt_labels:
      - Pass-Through Funding
      - Federal Flow-Through
      - Subaward In
    definition: >-
      Federal funds received by UNMC through a non-federal pass-through entity (the prime
      recipient) rather than directly from the federal agency. Pass-through funds carry the
      federal terms and conditions that flow down from the prime award.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

term_creations:
  - id: term:federal-pass-through-creation
    label: Creation of "Federal Pass-Through Funding"
    has_output: term:federal-pass-through
    part_of: gov:research-data-governance

term_status_boundaries:   # quote every date
