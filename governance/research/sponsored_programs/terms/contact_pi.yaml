glossary_terms:
  - id: term:contact-principal-investigator
    label: Contact Principal Investigator
    alt_labels:
      - Contact PI
    definition: >-
      The principal investigator who is responsible for fielding inquiries regarding the project.
      On a project with co-equal principal investigators, this individual may be listed as the sole
      PI in systems of record which only support or display a single PI per project.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000023   # role (role)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:research-stewardship-committee
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:sponsored-programs-office
    broader:
      - term:principal-investigator
    related:
      - term:multiple-pi

