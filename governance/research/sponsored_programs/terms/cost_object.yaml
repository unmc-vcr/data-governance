glossary_terms:
  - id: term:cost-object
    label: Cost Object (SAP)
    alt_labels:
      - SAP Cost Object
      - WBS Element
      - SAP Account
    definition: >-
      The SAP financial account -- WBS element or cost center -- to which a sponsored
      project's expenditures are posted. It is the bridge between an award in SPAdmin and
      the institutional general ledger.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000030   # information content entity (information_artifact)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

