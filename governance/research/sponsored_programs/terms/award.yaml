glossary_terms:
  - id: term:award
    label: Award
    alt_labels:
      - Grant Award
      - Funded Award
    definition: >-
      A sponsor's authorized commitment of funds to a sponsored project for a defined scope
      and period, distinct from the proposal that requested it. A single sponsored project
      may accrue several awards over its life.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000030   # information content entity (information_artifact)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:ra-governance-council
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:sponsored-programs-office

