glossary_terms:
  - id: term:budget-period
    label: Budget Period
    alt_labels:
      - Project Year
      - Cycle
    definition: >-
      A discrete, separately budgeted interval within a multi-year award -- typically one
      project year -- against which spending and reporting are tracked.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000038   # one-dimensional temporal region (interval)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:ra-governance-council
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:sponsored-programs-office

term_creations:
  - id: term:budget-period-creation
    label: Creation of "Budget Period"
    has_output: term:budget-period
    part_of: gov:research-data-governance

term_status_boundaries:   # quote every date
  - type: dgo:DGO_00000024   # drafted
    part_of: term:budget-period-creation
    occurred_on: "2026-09-28"
