glossary_terms:
  - id: term:sponsor
    label: Sponsor
    alt_labels:
      - Funding Agency
      - Sponsoring Agency
    definition: >-
      The external entity that provides, or is asked to provide, funding for a sponsored
      project. Sponsors are classified by type -- federal, state, foundation, industry, and
      so on.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000004   # independent continuant (agent)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:ra-governance-council
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:sponsored-programs-office

