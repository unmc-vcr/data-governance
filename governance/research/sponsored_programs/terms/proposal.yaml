glossary_terms:
  - id: term:proposal
    label: Proposal
    alt_labels:
      - Funding Request
      - Request
      - Research Administration Request
    definition: >-
      A request submitted to a sponsor to establish, continue, or modify funding for a
      sponsored project. The research-administration (RA) type distinguishes the kind of
      request -- new, renewal, supplement, continuation, and so on.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000030   # information content entity (information_artifact)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:ra-governance-council

term_creations:
  - id: term:proposal-creation
    label: Creation of "Proposal"
    has_output: term:proposal
    part_of: gov:research-data-governance

term_status_boundaries:   # quote every date
