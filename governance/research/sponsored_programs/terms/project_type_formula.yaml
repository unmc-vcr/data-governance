glossary_terms:
  - id: term:project-type-formula
    label: Formula
    alt_labels:
      - Formula Grant
      - Formula Funds
    definition: >-
      A project type in which funds are allocated to UNMC by a formula set in statute or
      regulation (for example, by population or other measured need) rather than through
      competitive review of a proposal.
    part_of: area:unmc-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: iao:0000030   # information content entity (information_artifact)
    value_of: term:project-type
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:research-stewardship-committee
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: subject matter expert
        role_of: office:sponsored-programs-office

