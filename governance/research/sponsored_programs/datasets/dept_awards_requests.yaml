# Department Awards & Requests: the data set behind the Department Dashboards
# Tableau workbook, written as DGO 0.3.0 instance data.
#
# Built by the dbt model `dept_awards_requests` in unmc-vcr/data-orchestration
# (relation marts.sp_dept_awards_requests). The dbt exposure and every column in
# that model carry the IRIs declared here.
#
# `represents:` marks the glossary terms a column determines. DGO records that on
# the term (glossary term `informed_by`), which dgo-atlas 0.5.2 can't resolve yet;
# see datasets/README.md for the move into governance/.

data_sets:
  - id: data:radb-sponsored-projects
    label: RADB sponsored projects
    description: >-
      RADB's sponsored-project tables (GA_Master, GA_Awards, GA_Request, GA_Staff,
      GA_People_Names, GA_Departments, GA_Sponsor_Codes and their code tables),
      landed in the warehouse by dlt with SCD2 history. The source of truth for
      proposals and for current-fiscal-year awards.
    stored_in:
      - data:radb
      - data:research-warehouse
    in_subject_area:
      - area:sponsored-programs
    sensitivity: data:classifications#medium-risk
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office

  - id: data:spa-audited-snapshot
    label: Sponsored Programs audited fiscal-year snapshot
    description: >-
      Awards, projects, staffing and compliance frozen at each fiscal-year close and
      audited (VCRDA.sponsored_projects.audited_*). The source of truth for awards in
      closed fiscal years: it supersedes the live RADB values once a year is closed.
    stored_in:
      - data:research-warehouse
    in_subject_area:
      - area:sponsored-programs
    sensitivity: data:classifications#medium-risk
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office

  - id: data:dept-awards-requests
    label: Department Awards & Requests
    description: >-
      Award actions and proposals (requests) for UNMC sponsored projects with their
      principal investigator's home department, one row per record category,
      project, record and PI. Award rows for the current fiscal year come from RADB;
      award rows for closed fiscal years come from the audited fiscal-year snapshot.
      Request rows come from RADB for every year. Consumed by the Department
      Dashboards Tableau workbook.
    stored_in:
      - data:research-warehouse
    in_subject_area:
      - area:sponsored-programs
    derived_from:
      - data:radb-sponsored-projects
      - data:spa-audited-snapshot
    sensitivity: data:classifications#medium-risk
    security_level: data:security-level#role-based
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:research-stewardship-committee
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-analytics
      - type: dgo:DGO_00000015   # subject matter expert
        role_of: office:sponsored-programs-office

data_elements:

  # --- the record ---------------------------------------------------------------

  - id: data:dept-awards-requests/record_category
    label: record_category
    description: >-
      Whether the row is an award action ('award') or a proposal ('submission').
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/project_id
    label: project_id
    description: The Grant ID (GID) of the sponsored project the record belongs to.
    part_of: data:dept-awards-requests
    represents: term:grant-id

  - id: data:dept-awards-requests/record_id
    label: record_id
    description: >-
      The record's sequence within its project: the award sequence for awards, the
      request sequence for proposals. Unique within a project and record category.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/record_date
    label: record_date
    description: >-
      The award date for awards, the request date for proposals. Drives the fiscal
      year columns.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/record_type_code
    label: record_type_code
    description: >-
      The research-administration (RA) type code of the record (new, renewal,
      supplement, continuation, and so on).
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/record_type_label
    label: record_type_label
    description: The research-administration (RA) type of the record, as a label.
    part_of: data:dept-awards-requests
    represents: term:proposal

  - id: data:dept-awards-requests/record_begin_date
    label: record_begin_date
    description: Start of the budget period the award or request covers.
    part_of: data:dept-awards-requests
    represents: term:budget-period

  - id: data:dept-awards-requests/record_end_date
    label: record_end_date
    description: End of the budget period the award or request covers.
    part_of: data:dept-awards-requests
    represents: term:budget-period

  - id: data:dept-awards-requests/record_status_code
    label: record_status_code
    description: >-
      Status code of the award or request (for requests, the effective status).
    part_of: data:dept-awards-requests
    represents: term:proposal-status

  - id: data:dept-awards-requests/record_status_label
    label: record_status_label
    description: >-
      Status of the award or request, as a label.
    part_of: data:dept-awards-requests
    represents: term:proposal-status

  # --- the project --------------------------------------------------------------

  - id: data:dept-awards-requests/project_status
    label: project_status
    description: >-
      The project's status code.
    part_of: data:dept-awards-requests
    represents: term:project-status

  - id: data:dept-awards-requests/project_status_label
    label: project_status_label
    description: >-
      The project's status, as a label. For awards in closed fiscal years, the
      status recorded in the audited snapshot.
    part_of: data:dept-awards-requests
    represents: term:project-status

  - id: data:dept-awards-requests/project_type
    label: project_type
    description: Whether the sponsored project is a Grant, a Contract, or Other.
    part_of: data:dept-awards-requests
    represents: term:project-type

  - id: data:dept-awards-requests/project_category_label
    label: project_category_label
    description: >-
      The project's category of activity (Research, Instructional, Public Service,
      etc.), which is what distinguishes one kind of sponsored project from
      another.
    part_of: data:dept-awards-requests
    represents: term:project-category

  - id: data:dept-awards-requests/project_title
    label: project_title
    description: The sponsored project's title.
    part_of: data:dept-awards-requests
    represents: term:project-title

  - id: data:dept-awards-requests/project_begin_date
    label: project_begin_date
    description: Start of the project's period of performance.
    part_of: data:dept-awards-requests
    represents: term:period-of-performance

  - id: data:dept-awards-requests/project_end_date
    label: project_end_date
    description: End of the project's period of performance.
    part_of: data:dept-awards-requests
    represents: term:period-of-performance

  # --- sponsors and funding -----------------------------------------------------

  - id: data:dept-awards-requests/funding_category
    label: funding_category
    description: >-
      Normalized funding category from the direct and prime sponsors' types:
      federal_subcontract when the prime sponsor is federal, otherwise federal,
      state, industry, other or formula from the direct sponsor's type.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/sponsor_direct_name
    label: sponsor_direct_name
    description: The sponsor that funds UNMC directly.
    part_of: data:dept-awards-requests
    represents: term:sponsor

  - id: data:dept-awards-requests/sponsor_direct_type_label
    label: sponsor_direct_type_label
    description: The direct sponsor's type (Federal agencies, Industry, and so on).
    part_of: data:dept-awards-requests
    represents: term:sponsor

  - id: data:dept-awards-requests/sponsor_prime_name
    label: sponsor_prime_name
    description: >-
      The originating source of funds when UNMC is funded through a pass-through
      entity. Null when the direct sponsor is the source.
    part_of: data:dept-awards-requests
    represents: term:prime-sponsor

  - id: data:dept-awards-requests/sponsor_prime_type_label
    label: sponsor_prime_type_label
    description: The prime sponsor's type.
    part_of: data:dept-awards-requests
    represents: term:prime-sponsor

  - id: data:dept-awards-requests/direct_cost
    label: direct_cost
    description: Direct costs of the award action or request, in dollars (0 when absent).
    part_of: data:dept-awards-requests
    represents: term:direct-cost

  - id: data:dept-awards-requests/indirect_cost
    label: indirect_cost
    description: Indirect (F&A) costs of the award action or request, in dollars (0 when absent).
    part_of: data:dept-awards-requests
    represents: term:indirect-cost

  - id: data:dept-awards-requests/total_cost
    label: total_cost
    description: direct_cost plus indirect_cost.
    part_of: data:dept-awards-requests
    represents: term:total-cost

  - id: data:dept-awards-requests/activity_code
    label: activity_code
    description: The sponsor's activity code for the record (for NIH, e.g. R01).
    part_of: data:dept-awards-requests
    represents: term:activity-code

  # --- the principal investigator's home department -----------------------------
  # These are the PI's own organization, not the project's administering
  # department (term:administering-department), so they inform no term.

  - id: data:dept-awards-requests/unit
    label: unit
    description: The college or unit of the PI's home department.
    part_of: data:dept-awards-requests
    represents: term:vc-vp-unit

  - id: data:dept-awards-requests/department
    label: department
    description: The PI's home department.
    part_of: data:dept-awards-requests
    represents: term:department

  - id: data:dept-awards-requests/division
    label: division
    description: The PI's division or section within the department, when there is one.
    part_of: data:dept-awards-requests
    represents: term:division

  - id: data:dept-awards-requests/hr_org_unit
    label: hr_org_unit
    description: The HR (SAP) org-unit code of the PI's home department.
    part_of: data:dept-awards-requests

  # --- the principal investigator -----------------------------------------------

  - id: data:dept-awards-requests/pi_name_first
    label: pi_name_first
    description: The PI's first name.
    part_of: data:dept-awards-requests
    represents: term:principal-investigator

  - id: data:dept-awards-requests/pi_name_last
    label: pi_name_last
    description: The PI's last name.
    part_of: data:dept-awards-requests
    represents: term:principal-investigator

  - id: data:dept-awards-requests/pi_personnel_number
    label: pi_personnel_number
    description: The PI's personnel number.
    part_of: data:dept-awards-requests
    represents: term:principal-investigator

  - id: data:dept-awards-requests/pi_nuid
    label: pi_nuid
    description: The PI's NUID (University of Nebraska ID).
    part_of: data:dept-awards-requests
    represents: term:principal-investigator

  # --- fiscal calendar ----------------------------------------------------------

  - id: data:dept-awards-requests/fiscal_year
    label: fiscal_year
    description: The fiscal year (July to June, named for the year it ends) of record_date.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/fiscal_quarter
    label: fiscal_quarter
    description: The fiscal quarter (1 to 4) of record_date.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/first_of_fiscal_year
    label: first_of_fiscal_year
    description: The first day of record_date's fiscal year.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/last_of_fiscal_year
    label: last_of_fiscal_year
    description: The last day of record_date's fiscal year.
    part_of: data:dept-awards-requests

  - id: data:dept-awards-requests/is_current_fiscal_year
    label: is_current_fiscal_year
    description: >-
      1 when record_date falls in the current fiscal year. Those award rows come
      from RADB; award rows with 0 come from the audited snapshot.
    part_of: data:dept-awards-requests

lifecycle_processes:
  - id: data:dept-awards-requests#certification
    type: creation
    label: Certification of "Department Awards & Requests"
    has_output: data:dept-awards-requests
    part_of: gov:research-data-governance

status_boundaries:
  - type: drafted
    part_of: data:dept-awards-requests#certification
    occurred_on: "2026-10-14"
  - type: submitted for review
    part_of: data:dept-awards-requests#certification
    occurred_on: "2026-11-19"
