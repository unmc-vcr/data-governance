glossary_terms:
  - id: term:activation-timeline
    label: Activation Timeline
    alt_labels:
      - Time to Trial
      - Startup
    definition: >-
      The amount of time, in calendar days, that it takes for a clinical study to open to
      accrual to potential participants.
    part_of: area:research-glossary
    in_subject_area: area:clinical-research
    # semantic_type: measure   # no slot in DGO 0.1.0 yet
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
  - id: term:activation-timeline-creation
    label: Creation of "Activation Timeline"
    has_output: term:activation-timeline
    part_of: office:research-data-governance

term_status_boundaries:   # quote every date
