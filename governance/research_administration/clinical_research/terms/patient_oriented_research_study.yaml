glossary_terms:
  - id: term:patient-oriented-research-study
    label: Patient-oriented research study
    definition: >-
      Research conducted with human subjects (or on material of human origin such as
      tissues, specimens, and cognitive phenomena) for which an investigator (or colleague)
      directly interacts with human subjects. It includes: (a) mechanisms of human disease,
      (b), therapeutic interventions, (c) clinical trials, or (d) development of new
      technologies.
    definition_source: https://grants.nih.gov/grants/glossary.htm#ClinicalResearch
    part_of: area:research-glossary
    in_subject_area: area:clinical-research
    broader:
      - term:clinical-research
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

