glossary_terms:
  - id: term:study-status-open-to-accrual
    label: Open to Accrual (status)
    alt_labels:
      - Open
      - Enrolling
      - Accruing
    definition: >-
      A study status in which a study is currently permitted to enroll new subjects. A study
      is in this state from its open to accrual date until enrollment is placed on hold or
      the study is closed to accrual.
    part_of: area:research-glossary
    in_subject_area: area:clinical-research
    semantic_type: bfo:0000019   # quality (state)
    related:
      - term:open-to-accrual
    value_of: term:study-status
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:clinical-research-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
  - id: term:study-status-open-to-accrual-creation
    label: Creation of "Open to Accrual (status)"
    has_output: term:study-status-open-to-accrual
    part_of: office:research-data-governance

