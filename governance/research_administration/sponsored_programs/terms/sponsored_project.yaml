glossary_terms:
  - id: term:sponsored-project
    label: Sponsored Project
    alt_labels:
      - Sponsored Program
      - Grant
    definition: >-
      An externally funded project or activity, of any category, established through a
      request to and an award from a sponsor and administered by UNMC under the terms of
      that funding. The category of activity -- research, instruction, public service, and
      so on -- is what distinguishes one sponsored project from another; it is not limited
      to research.
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000015   # process (process)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
