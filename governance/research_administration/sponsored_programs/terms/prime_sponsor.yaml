glossary_terms:
  - id: term:prime-sponsor
    label: Prime Sponsor
    alt_labels:
      - Originating Sponsor
      - Prime
    definition: >-
      The originating source of funds when UNMC receives an award through an intermediary
      (pass-through) entity rather than directly from that source. The prime sponsor's terms
      flow down through the pass-through entity to UNMC.
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    semantic_type: bfo:0000023   # role (role)
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

