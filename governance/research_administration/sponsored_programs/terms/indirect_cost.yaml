glossary_terms:
  - id: term:indirect-cost
    label: Indirect Cost
    alt_labels:
      - Facilities and Administrative costs (F&A)
    definition: >-
      Necessary costs incurred for a common or joint purpose that cannot be readily
      identified with an individual project or program.
    definition_source: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_7/7.3_direct_costs_and_indirect_costs.htm
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    # semantic_type: measure   # no slot in DGO 0.1.0 yet
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

