glossary_terms:
  - id: term:multiple-pi
    label: Multiple PI (Multi-PI)
    alt_labels:
      - Multi-PI
      - MPI
      - Multiple Principal Investigator
    definition: >-
      A designation that formal leadership of a sponsored project is shared among two or
      more co-equal principal investigators, each accountable for the project as a whole.
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    # semantic_type: role   # no slot in DGO 0.1.0 yet
    broader:
      - term:principal-investigator
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
  - id: term:multiple-pi-creation
    label: Creation of "Multiple PI (Multi-PI)"
    has_output: term:multiple-pi
    part_of: office:research-data-governance

