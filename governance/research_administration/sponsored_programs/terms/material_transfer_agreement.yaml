glossary_terms:
  - id: term:material-transfer-agreement
    label: Material Transfer Agreement (MTA)
    alt_labels:
      - MTA
    definition: >-
      An agreement governing the transfer of tangible research materials between UNMC and
      another organization, setting out permitted use, ownership, and publication terms.
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    # semantic_type: information_artifact   # no slot in DGO 0.1.0 yet
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
