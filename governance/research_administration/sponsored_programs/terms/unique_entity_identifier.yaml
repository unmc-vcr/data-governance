glossary_terms:
  - id: term:unique-entity-identifier
    label: Unique Entity Identifier (UEI)
    alt_labels:
      - UEI
      - Entity ID
    definition: >-
      The government-assigned identifier for an organization registered in SAM.gov, used to
      identify a sponsor or recipient. It replaced the DUNS Number.
    part_of: area:research-glossary
    in_subject_area: area:sponsored-programs
    # semantic_type: information_artifact   # no slot in DGO 0.1.0 yet
    responsibilities:
      - type: dgo:DGO_00000012   # owner
        role_of: office:sponsored-programs-office
      - type: dgo:DGO_00000013   # steward
        role_of: office:research-admin-stewardship-council

term_creations:
  - id: term:unique-entity-identifier-creation
    label: Creation of "Unique Entity Identifier (UEI)"
    has_output: term:unique-entity-identifier
    part_of: office:research-data-governance

term_status_boundaries:   # quote every date
  - type: dgo:DGO_00000024   # drafted
    part_of: term:unique-entity-identifier-creation
    occurred_on: "2026-09-28"
