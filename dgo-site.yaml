# Site configuration for dgo-site. Governance data lives in governance/;
# this file only shapes the site. Every setting and its default is in
# https://github.com/james-geiger/dgo-site/blob/main/dgo-site.example.yaml

# The Data Governance Ontology release the data is written against. Change it
# deliberately: a new release may change what the data must say.
dgo_version: "0.1.0"

title: Research Administration Data Governance
organization: University of Nebraska Medical Center
description: >-
  The shared, authoritative source for what research administration data at
  UNMC actually means.
# contact_email:

# Every id in governance/ is a CURIE using one of these prefixes. They are the
# terms' IRIs: never change a base once published.
prefixes:
  term: https://w3id.org/unmc/terms/
  area: https://w3id.org/unmc/areas/
  office: https://w3id.org/unmc/offices/
  person: https://w3id.org/unmc/people/

paths:
  data: governance
  content: content
  output: site

# GitHub Pages project site.
base_path: /data-governance/

repository:
  url: https://github.com/unmc-vcr/data-governance
  branch: main
suggest_change_url: https://github.com/unmc-vcr/data-governance/issues/new?template=term-change.yml&labels=terms&title=Change+request%3A+&term=

brand:
  mark: "N"
  accent: "#AD122A"   # UNMC red

text:
  nav.directory: Offices
