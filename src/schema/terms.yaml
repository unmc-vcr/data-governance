id: https://w3id.org/unmc/model/
name: unmc_terms
title: UNMC Research Administration Data Governance
description: >-
  Governed business terms, organized by subject area. Terms are data files
  validated against this schema. The schema describes the shape of a term;
  the terms themselves live in src/definitions/.
version: 0.2.0
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  org: http://www.w3.org/ns/org#
  prov: http://www.w3.org/ns/prov#
  foaf: http://xmlns.com/foaf/0.1/
  isbn: https://openlibrary.org/isbn/
  unmc:   https://w3id.org/unmc/model/
  term:   https://w3id.org/unmc/terms/
  area:   https://w3id.org/unmc/areas/
  office: https://w3id.org/unmc/offices/
  person: https://w3id.org/unmc/people/
  obo: http://purl.obolibrary.org/obo/
  bfo: http://purl.obolibrary.org/obo/BFO_
  obi: http://purl.obolibrary.org/obo/OBI_
  iao: http://purl.obolibrary.org/obo/IAO_
default_prefix: unmc
default_range: string

imports:
  - linkml:types

classes:

  Terms:
    description: >-
      Per-file container for validation only; not part of the published
      vocabulary. Its blank node is stripped before the vocabulary is published
      as RDF.
    tree_root: true
    slots: [subject_areas, terms, agents, people]

  SubjectArea:
    class_uri: skos:ConceptScheme
    description: A governed grouping of terms, owned end to end by one office.
    slots: [id, pref_label, definition, responsibilities]

  Term:
    class_uri: skos:Concept
    description: >-
      One governed business term. Exactly one definition, one accountable
      definition owner, and a status that says how far it has moved through
      review.
    slots:
      - id
      - code
      - pref_label
      - alt_labels
      - definition
      - definition_source
      - in_subject_area
      - semantic_type
      - broader
      - value_of
      - related
      - classification
      - source_of_record
      - rules
      - used_in
      - guidance
      - responsibilities
      - status
      - exact_match
      - close_match
      - realized_by
      - replaced_by

  Responsibility:
    class_uri: prov:Attribution
    description: >-
      One office or role holding one governance role for a term or subject
      area. A value object, not an identified thing.
    slots: [agent, governance_role]
    slot_usage:
      agent:
        required: true
      governance_role:
        required: true

  SourceOfRecord:
    description: >-
      The system that is authoritative for the values behind this term, and
      where in that system the values live.
    slots: [system, field, format, refresh]
    slot_usage:
      system:
        required: true

  Usage:
    description: A report, dashboard, or extract that depends on this term.
    slots: [usage_name, usage_owner]
    slot_usage:
      usage_name:
        required: true

  Guidance:
    description: >-
      A single callout shown with the term. Used for a handling rule, a
      caveat, or a warning that the definition is still moving.
    slots: [guidance_kind, guidance_text]
    slot_usage:
      guidance_kind:
        required: true
      guidance_text:
        required: true

  Agent:
    exact_mappings:
      - prov:Agent
    description: >-
      An office, role, or committee that can hold a governance role. Agents
      are offices, not individuals, so that ownership survives staff turnover.
      An office may list the people who currently staff it in `contacts`;
      those are a directory, and accountability stays with the office.
    slots: [id, category, pref_label, email, contacts]

  Person:
    class_uri: foaf:Person
    description: >-
      A named individual who staffs one or more offices. People are a
      directory so a reader knows who to ask for. A Person is never the target
      of a Responsibility -- accountability rests with an office (Agent), which
      resolves to whoever currently staffs it.
    slots: [id, name, email, title]

  DefinitionSource:
    description: >-
      words
    slots: [source_uri, source_label]

  StewardshipCouncil:
    is_a: Agent
    exact_mappings:
      - org:Organization
    description: A committee-Agent whose seats are held by named people.
    slots: [memberships]

  Membership:
    class_uri: org:Membership
    description: One person holding one seat on a council. A value object.
    slots: [member, council_role]
    slot_usage:
      member: { required: true }
      council_role: { required: true }

slots:

  id:
    identifier: true
    range: uriorcurie

  code:
    description: >-
      Short human-quotable identifier, e.g. CR.AE.001. Subject-area prefix,
      concept abbreviation, sequence. Stable for the life of the term.
    slot_uri: skos:notation
    pattern: '^[A-Z]{2}\.[A-Z]{2,4}\.[0-9]{3}$'

  pref_label:
    slot_uri: skos:prefLabel
    required: true

  alt_labels:
    description: >-
      Other names people actually use for this term. Indexed by site search,
      so add the wrong-but-common names too.
    slot_uri: skos:altLabel
    multivalued: true

  definition:
    slot_uri: skos:definition
    required: true

  definition_source:
    description: Where the wording came from, if it was adopted rather than written here.
    range: DefinitionSource

  source_uri:
    description: >-
      The record or persistent identifier of the source.
    slot_uri: dcterms:source
    range: uriorcurie
    required: true

  source_label:
    description: The human-readable description of the source.

  in_subject_area:
    slot_uri: skos:inScheme
    range: SubjectArea
    required: true

  semantic_type:
    description: >-
      The ontological nature of the entity a term denotes.
    range: SemanticType

  broader:
    description: >-
      A term that generalizes this one: genus/subtype (is-a). Not to be used 
      with determinable value to attribute relationsips; use value_of.
    slot_uri: skos:broader
    range: Term
    multivalued: true

  value_of:
    description: >-
      For a term that is a determinate value, the attribute for which it is a permissible value. 
      This is the controlled-value relation, distinct from broader (generalization).
    range: Term

  related:
    description: >-
      Another governed term that is conceptually associated with this one,
      where neither is broader nor narrower than the other.
    slot_uri: skos:related
    range: Term
    multivalued: true

  classification:
    description: >-
      Handling tier for data implementing this term.
    range: DataClassification

  source_of_record:
    description: The authoritative system for this term's values.
    range: SourceOfRecord
    inlined: true

  rules:
    description: >-
      Qualifiers that change how the term is counted or applied. One rule per
      entry, written as an instruction rather than a description.
    multivalued: true

  used_in:
    description: Reports and extracts known to depend on this term.
    range: Usage
    multivalued: true
    inlined_as_list: true

  guidance:
    description: Callouts shown alongside the definition.
    range: Guidance
    multivalued: true
    inlined_as_list: true

  status:
    range: TermStatus
    required: true

  exact_match:
    description: An external concept that means the same thing.
    slot_uri: skos:exactMatch
    range: uriorcurie
    multivalued: true

  close_match:
    description: An external concept that is similar but not interchangeable.
    slot_uri: skos:closeMatch
    range: uriorcurie
    multivalued: true

  realized_by:
    description: Schema class, slot, or warehouse column that implements this term.
    slot_uri: dcterms:isReferencedBy
    range: uriorcurie
    multivalued: true

  replaced_by:
    description: For deprecated terms, the term that supersedes this one.
    slot_uri: dcterms:isReplacedBy
    range: Term

  responsibilities:
    description: >-
      Who is accountable for this term. Exactly one definition_owner is
      required.
    slot_uri: prov:qualifiedAttribution
    range: Responsibility
    multivalued: true
    inlined_as_list: true
    required: true

  agent:
    description: Office, group, or role IRI. Not an individual.
    slot_uri: prov:agent
    range: uriorcurie

  governance_role:
    slot_uri: prov:hadRole
    range: GovernanceRole

  system:
    description: Name of the authoritative system, e.g. "OnCore - adverse event module".

  field:
    description: Column or field name within the source system.

  format:
    description: Shape of the stored value, in plain language.

  refresh:
    description: How often the warehouse copy is refreshed.

  usage_name:
    description: Name of the report, dashboard, or extract.

  usage_owner:
    description: Office that owns that report.

  guidance_kind:
    range: GuidanceKind

  guidance_text:
    description: The callout body. One short paragraph.

  email:
    description: >-
      Email address. On an office this is a shared mailbox; on a person it is
      their own address.
    slot_uri: foaf:mbox

  name:
    description: A person's full name.
    slot_uri: foaf:name
    required: true

  title:
    description: >-
      A person's job title, e.g. "Research Data Manager". Presentation only.

  contacts:
    description: >-
      People who currently staff this office. A directory for readers -- who
      to ask for -- not a transfer of accountability, which stays with the
      office. The same person may staff more than one office.
    range: Person
    multivalued: true
    inlined: false

  category:
    description: >-
      Discriminates agent subtypes within the shared agents registry.
      Value is the subtype's class IRI, e.g. org:Organization for a council.
    designates_type: true
    range: uriorcurie

  subject_areas:
    range: SubjectArea
    multivalued: true
    inlined_as_list: true

  terms:
    range: Term
    multivalued: true
    inlined_as_list: true

  agents:
    range: Agent
    multivalued: true
    inlined_as_list: true

  people:
    range: Person
    multivalued: true
    inlined_as_list: true

  memberships:
    range: Membership
    multivalued: true
    inlined_as_list: true

  member:
    slot_uri: org:member
    range: Person

  council_role:
    slot_uri: org:role
    range: CouncilRole

enums:

  GovernanceRole:
    description: What an office is on the hook for.
    permissible_values:
      definition_owner:
        meaning: unmc:roles/definition-owner
        description: Accountable for approving the definition.
      data_steward:
        meaning: unmc:roles/data-steward
        description: Responsible for quality of implementing data.
      business_sme:
        meaning: unmc:roles/business-sme
        description: Consulted on meaning and use in practice.
      data_custodian:
        meaning: unmc:roles/data-custodian
        description: Consulted on the collection, storage, and management of data through IT lens.

  CouncilRole:
    description: What facet of stewardship the role holder is responsible.
    permissible_values:
      chair:
        meaning: unmc:roles/council#chair
        description: Convenes the council and owns final sign-off on decisions.
      security:
        meaning: unmc:roles/council#security
        description: Advises on access controls and safeguarding of the data.
      ethics:
        meaning: unmc:roles/council#ethics
        description: Advises on ethical use and transparency across the organization.
      documentation:
        meaning: unmc:roles/council#documentation
        description: Keeps definitions, lineage, and decisions documented.
      compliance:
        meaning: unmc:roles/council#compliance
        description: Advises on regulatory and policy conformance.

  TermStatus:
    description: How far a term has moved through review.
    permissible_values:
      draft:
        meaning: unmc:status/draft
        description: Written but not yet checked against real data.
      in_review:
        meaning: unmc:status/in-review
        description: Steward and SME are validating it. Not citable in reporting.
      approved:
        meaning: unmc:status/approved
        description: Signed off. Reports may cite it.
      deprecated:
        meaning: unmc:status/deprecated
        description: Superseded. Retained for historical reconciliation only.

  DataClassification:
    description: >-
      PROVISIONAL handling tier. Carried over from the site design pending
      confirmation by Compliance and Privacy. Not policy yet.
    permissible_values:
      public:
        meaning: unmc:classification/public
        description: Cleared for open release.
      internal:
        meaning: unmc:classification/internal
        description: Routine operating data. UNMC login required.
      sensitive:
        meaning: unmc:classification/sensitive
        description: Disclosure would cause real harm. Access granted per project.
      restricted:
        meaning: unmc:classification/restricted
        description: Regulated identifiable data. Approved enclave only.

  GuidanceKind:
    description: Tone of a callout, which decides how it is styled.
    permissible_values:
      required:
        description: A rule that must be followed.
      good_to_know:
        description: Context that helps but does not gate the task.
      in_review:
        description: Warning that this content may change before approval.
      draft:
        description: Warning that this term has no approved basis yet.

  SemanticType:
    description: >-
      The ontological nature of what a term denotes. Values are anchored to BFO/OBO
      upper classes.
    permissible_values:
      event:
        meaning: bfo:0000035
        # bfo:0000035 - process boundary (occurrent)
        description: >-
          A dated point marking a transition in a lifecycle -- a milestone.
          E.g. the date a study opened to accrual.
      measure:
        meaning: iao:0000027
        # iao:0000027 - data entity
        description: >-
          A quantitative datum, such as an elapsed-time count between two
          events or a negotiated rate.
      attribute:
        meaning: bfo:0000019
        # bfo:0000019 - quality (determinable)
        description: >-
          A determinable characteristic realized as one of a controlled set
          of states. The "field", not its values. E.g. accrual status.
      state:
        meaning: bfo:0000019
        # bfo:0000019 - quality (determinate)
        description: >-
          A determinate value of an attribute; one member of its controlled
          set, linked to the attribute by value_of. E.g. on hold.
      classification:
        meaning: obi:0000011
        # planned process
        description: >-
          A kind or category of study, project, or other planned process.
          E.g. clinical trial, research project.
      process:
        meaning: bfo:0000015        # process
        description: >-
          A kind or category of activity that unfolds over time -- a study,
          project, or program type. E.g. clinical trial, research project.
          (Replaces the earlier "classification": obi:0000011 "planned
          process" is deprecated, and bfo:0000015 is the next-broadest fit.)
      interval:
        meaning: bfo:0000038        # one-dimensional temporal region
        description: >-
          A located span of time with a start and an end -- a calendar window,
          not a count. Distinct from measure: an interval is a region of the
          time axis (occurrent), a measure is a magnitude (a data item).
          E.g. period of performance, budget period.
      role:
        meaning: bfo:0000023
        # role (realizable entity)
        description: >-
          A role a person or organization holds in a context, realized by
          taking part in a process. E.g. principal investigator, prime sponsor.
      agent:
        meaning: bfo:0000004
        # independent continuant
        description: >-
          A party -- a person, an organization, or organizational unit -- named as a kind
          of thing rather than a role it plays. E.g. sponsor, administering
          department.
      information_artifact:
        meaning: iao:0000030
        # information content entity
        description: >-
          A document, agreement, record, or identifier -- information that is
          about something else. E.g. award, proposal, grant ID, unique entity
          identifier.