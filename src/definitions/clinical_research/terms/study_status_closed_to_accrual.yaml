terms:
  - id: term:study-status-closed-to-accrual
    code: CR.ACT.006
    pref_label: Closed to Accrual
    alt_labels: [Closed, Enrollment closed]
    definition: >-
      An accrual status in which a study is no longer permitted to enroll new subjects, whether
      because target accrual was reached or because the study was terminated.
    in_subject_area: area:clinical-research
    semantic_type: state
    value_of: term:accrual-status
    responsibilities:
      - agent: office:clinical-research-office
        governance_role: definition_owner
      - agent: office:research-admin-stewardship-council
        governance_role: data_steward
    status: draft
