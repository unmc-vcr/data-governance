terms:
  - id: term:open-to-accrual
    code: CR.ACT.002
    pref_label: Open to Accrual
    alt_labels: []
    definition: >-
      The date in a clinical study's lifecycle on which participants were first permitted to be
      enrolled, following all regulatory and sponsor requirements. This is the dated milestone that
      the activation timeline and study start-up measures count to; the ongoing "is it enrolling"
      condition is a separate term, accrual status.
    in_subject_area: area:clinical-research
    semantic_type: event
    related:
      - term:accrual-status-open
      - term:activation-timeline
    responsibilities:
      - agent: office:clinical-research-office
        governance_role: definition_owner
      - agent: office:research-admin-stewardship-council
        governance_role: data_steward
    status: draft