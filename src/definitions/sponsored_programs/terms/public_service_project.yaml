terms:
  - id: unmc:public-service-project
    code: SP.PS.001
    pref_label: Public Service Project
    alt_labels: [Public Service, Other Sponsored Activity]
    definition: An activity specifically organized and separately budgeted to provide non-instructional
      public services beneficial to groups external to the institution, whether commissioned by an agency
      external to the institution or separately by an organizational unit within the institution.
    broader: [unmc:sponsored-project]
    in_subject_area: unmc:sponsored-programs
    responsibilities:
      - agent: unmc:role/sponsored-programs-office
        governance_role: definition_owner
      - agent: unmc:role/research-analytics
        governance_role: data_steward
    status: draft
