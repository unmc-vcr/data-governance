terms:
  - id: term:unique-entity-identifier
    code: SP.SPON.003
    pref_label: Unique Entity Identifier (UEI)
    alt_labels: [UEI, Entity ID]
    definition: >-
      The government-assigned identifier for an organization registered in SAM.gov, used to
      identify a sponsor or recipient. It replaced the DUNS Number.
    in_subject_area: area:sponsored-programs
    source_of_record:
      system: SPAdmin reporting database (spareportdb)
      field: dbo.GA_Sponsor_Codes.Unique_Entity_Identifier
      format: SAM.gov twelve-character alphanumeric identifier.
    responsibilities:
      - agent: office:sponsored-programs-office
        governance_role: definition_owner
      - agent: office:research-admin-stewardship-council
        governance_role: data_steward
    status: draft
