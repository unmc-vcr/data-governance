terms:
  - id: unmc:notice-of-grant-award
    code: SP.AWD.003
    pref_label: Notice of Grant Award (NGA)
    alt_labels: [NGA, Notice of Award, NoA]
    definition: >-
      The sponsor's official document obligating funds to an award and stating its terms and
      conditions. Its date marks the point from which the award is active and costs may be
      charged.
    in_subject_area: unmc:sponsored-programs
    source_of_record:
      system: SPAdmin reporting database (spareportdb)
      field: dbo.GA_Awards.NGA_Date
      format: The date the sponsor issued the notice.
    responsibilities:
      - agent: unmc:role/sponsored-programs-office
        governance_role: definition_owner
      - agent: unmc:role/research-analytics
        governance_role: data_steward
    status: draft
