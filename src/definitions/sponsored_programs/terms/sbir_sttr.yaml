terms:
  - id: term:sbir-sttr
    code: SP.COMP.002
    pref_label: SBIR/STTR
    alt_labels: [SBIR, STTR, Small Business Innovation Research, Small Business Technology Transfer]
    definition: >-
      Federal programs -- Small Business Innovation Research (SBIR) and Small Business
      Technology Transfer (STTR) -- that fund research and development at small businesses,
      STTR requiring formal partnership with a research institution.
    in_subject_area: area:sponsored-programs
    source_of_record:
      system: SPAdmin reporting database (spareportdb)
      field: dbo.GA_Master.SBIR_STTR
      format: Indicator or code distinguishing SBIR from STTR.
    responsibilities:
      - agent: office:sponsored-programs-office
        governance_role: definition_owner
      - agent: office:research-analytics
        governance_role: data_steward
    status: draft
