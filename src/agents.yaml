# Registry of offices that can hold a governance role, and the people who
# staff them.
#
# Agents are offices, not people. An office IRI survives staff turnover; a
# person's name does not. Responsibility for a term always lands on an office.
#
# People are a directory only, so a reader knows who to ask for. An office
# lists its current staff in `contacts:` (a list of person IRIs from the
# `people:` block below). The same person may staff more than one office.
# Moving a person between offices never changes what an office is accountable
# for -- accountability stays with the office.
#
# Validated as a Glossary document (agents + people only) against
# src/schema/glossary.yaml. Every `agent:` IRI used in src/definitions/ must
# resolve to an entry here, and every `contacts:` IRI must resolve to a person;
# tools/glossary_site/checks.py fails the build otherwise.

