terms:
  - id: term:FullyLoaded
    code: AL.FUL.001
    pref_label: Fully Loaded
    alt_labels: [Everything Term, Kitchen Sink]
    definition: A term that fills in every optional slot the schema offers.
    definition_source:
      source_uri: https://example.edu/standards/fully-loaded
      source_label: Fully Loaded Standard (2nd ed.)
    in_subject_area: area:Alpha
    classification: sensitive
    source_of_record:
      system: Test System — main module
      field: FULL_ID
      format: Integer, system-assigned
      refresh: Nightly, 02:00 CT
    rules:
      - Counted once per occurrence, not once per report.
      - Severity and relatedness are separate attributes.
    used_in:
      - usage_name: Monthly Test Summary
        usage_owner: Office A
      - usage_name: Quarterly Rollup
        usage_owner: Office B
    guidance:
      - guidance_kind: required
        guidance_text: Never join this to identifiable fields outside an approved environment.
    responsibilities:
      - agent: office:OfficeA
        governance_role: definition_owner
      - agent: office:OfficeB
        governance_role: data_steward
    exact_match:
      - https://example.org/vocab/FullyLoaded
    close_match:
      - term:SomethingSimilar
    realized_by:
      - unmc:Study.identifier
    status: approved
