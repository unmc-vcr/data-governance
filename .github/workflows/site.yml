# Validate the term set and publish it to GitHub Pages.
#
# On a pull request: run the tests, validate, build and check internal links,
# then upload the site as a downloadable artifact. Stewards review rendered
# term pages rather than a YAML diff. Nothing deploys.
#
# On a push to main: the same, then deploy to Pages.
#
# The build is the gate. It fails on a schema violation, a dangling reference,
# an identifier that will not expand to a usable IRI, a term without exactly
# one definition owner, a deprecated term with no replacement, or a broken
# internal link.
#
# Pages requires the repository to be public, or GitHub Team/Enterprise Cloud
# on a private one.

name: Build and publish terms site

# Deliberately no `paths:` filter. If this workflow is ever made a required
# status check, a filtered run that is skipped never reports a result and the
# pull request blocks forever. The build takes about a minute, so running it on
# every change is the cheaper failure mode.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Pages allows one deployment at a time. Queue rather than cancel on main so
  # a deploy always completes; cancel superseded PR builds.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Each term's change history is read from the commits touching its
          # own file. A shallow clone renders every timeline empty without
          # erroring, so the full history is required.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build site
        run: uv run python -m terms_site.build --out site

      - name: Check for broken internal links
        run: uv run python -m terms_site.linkcheck site

      - name: Upload site artifact
        # Reviewable on every pull request: download, unzip, open index.html.
        # The site uses relative links throughout, so it works from file://
        # with no server.
        uses: actions/upload-artifact@v4
        with:
          name: terms-site
          path: site
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Research Administration Data Governance site"
            echo
            echo "- Terms: $(find src/definitions -path '*/terms/*.yaml' | wc -l | tr -d ' ')"
            echo "- Pages: $(find site -name '*.html' 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo
              echo "Download the **terms-site** artifact below and open \`index.html\`"
              echo "to review the rendered pages. No server needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
